name: Build Setup Ramdisk

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'iOS build version (e.g., 24A446, 24B119, 24B156)'
        required: false
        type: string
        default: '24A446'
      board:
        description: 'Board ID (e.g., j181ap for iPad 9 Wi-Fi, d421ap for iPhone 11 Pro)'
        required: false
        type: string
        default: 'j181ap'
      repo:
        description: 'Doublera1n repo URL (defaults to original)'
        required: false
        type: string
        default: 'https://github.com/34306/doublera1n.git'

permissions:
  contents: read
  actions: write

jobs:
  build-setuprd:
    name: Build Setup Ramdisk for ${{ github.event.inputs.build }} (${{ github.event.inputs.board }})
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Clone doublera1n repository
        run: |
          git clone --depth 1 ${{ github.event.inputs.repo }} doublera1n
          cd doublera1n
          pwd
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          which brew || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          if [[ $(uname -m) == "arm64" ]]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          brew install libimobiledevice libirecovery ldid libusb python3
          brew install blacktop/tap/ipsw

      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: doublera1n/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('doublera1n/requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Create Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          cd doublera1n
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt

      - name: Set up environment
        run: |
          echo "IPSW_SDK_PATH=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

      - name: Run precheck (validates build and generates profile)
        run: |
          cd doublera1n
          export PATH="$HOME/.local/bin:$PATH"
          .venv/bin/python3 dualboot.py precheck --build ${{ github.event.inputs.build }} --board ${{ github.event.inputs.board }}

      - name: Upload profile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: profile-${{ github.event.inputs.build }}-${{ github.event.inputs.board }}
          path: doublera1n/profiles/*-${{ github.event.inputs.build }}
          retention-days: 30

      - name: Summary
        run: |
          echo "## Precheck Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** ${{ github.event.inputs.build }}" >> $GITHUB_STEP_SUMMARY
          echo "**Board:** ${{ github.event.inputs.board }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Profile" >> $GITHUB_STEP_SUMMARY
          echo "✅ Profile generated at \`profiles/<board>-<build>\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the profile artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Place in your Linux machine at \`~/dualboot-work/profiles/<board>-<build>/profile.json\`" >> $GITHUB_STEP_SUMMARY
          echo "3. **For setup ramdisk**: Run \`./mk_setuprd.py install\` on macOS with device in DFU mode" >> $GITHUB_STEP_SUMMARY
          echo "4. Copy generated \`setuprd-install.img4\` and \`setuptc-install.img4\` to Linux" >> $GITHUB_STEP_SUMMARY
